apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: scalingpolicies.autoscaling.zhero.dev
spec:
  group: autoscaling.zhero.dev
  names:
    kind: ScalingPolicy
    listKind: ScalingPolicyList
    plural: scalingpolicies
    singular: scalingpolicy
    shortNames:
      - sp
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Target
          type: string
          jsonPath: .spec.targetDeploymentName
        - name: Replicas
          type: integer
          jsonPath: .status.currentReplicas
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - targetDeploymentName
                - metricEndpoint
                - scaleUpThreshold
                - scaleDownThreshold
                - minReplicas
                - maxReplicas
              properties:
                targetDeploymentName:
                  type: string
                metricEndpoint:
                  type: string
                scaleUpThreshold:
                  type: integer
                scaleDownThreshold:
                  type: integer
                minReplicas:
                  type: integer
                  minimum: 0
                maxReplicas:
                  type: integer
                  minimum: 1
                cooldownSeconds:
                  type: integer
                  default: 30
            status:
              type: object
              properties:
                currentReplicas:
                  type: integer
                lastObservedMetricValue:
                  type: integer
                lastScaleTime:
                  type: string
                  format: date-time