apiVersion: apps/v1
kind: Deployment
metadata:
  name: scalingpolicy-operator
  namespace: default
  labels:
    app: scalingpolicy-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scalingpolicy-operator
  template:
    metadata:
      labels:
        app: scalingpolicy-operator
    spec:
      serviceAccountName: scalingpolicy-operator
      containers:
        - name: manager
          image: k8s-custom-autoscaler:dev
          imagePullPolicy: Never
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi